# tests/TC-3.1.yaml: a unit test of a block
id: TC-3.1
covers: [AC-3.1]
level: unit
target: { kind: logicBlock, name: Intake_RoutingRules }
given:
  input: { EstimatedLoss: 50000.01, Threshold: 50000, PotentialDuplicate: false }
expect:
  output:
    QueueCode: HIGH-VALUE
