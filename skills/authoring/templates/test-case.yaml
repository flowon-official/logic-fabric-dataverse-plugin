# tests/TC-3.5.yaml: an integration test of a recipe (asynchronous step)
id: TC-3.5
covers: [AC-3.1]
level: integration
target: { kind: logicRecipe, name: Claim_OnCreate }
fixtures:
  - create: { table: fodemos_policy, as: policy, values: { fodemos_policynumber: "TST-{run}-P1" } }
when:
  create: { table: fodemos_claim, as: claim, values: { fodemos_name: "TST-{run}-C1", fodemos_policyid: "{policy}", fodemos_estimatedloss: { money: 50000.01 } } }
expect:
  - record: { ref: claim, columns: { fodemos_queuecode: HIGH-VALUE } }
    within: 60s
teardown: delete-created
